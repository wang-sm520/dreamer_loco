defaults:

  # Core runtime
  logdir: ~/logdir/{timestamp}
  replica: 0
  replicas: 1
  method: name
  task: dronenav_nav
  seed: 0
  script: train
  batch_size: 16
  batch_length: 64
  report_length: 32
  consec_train: 1
  consec_report: 1
  replay_context: 8
  random_agent: False
  clock_addr: ''
  clock_port: ''
  ipv6: False
  errfile: False

  # Logging
  logger:
    outputs: [jsonl, scope]
    filter: 'score|length|fps|ratio|train/loss/|train/rand/'
    timer: True
    fps: 15
    user: ''

  # Environment defaults
  env:
    drone_multi:
      headless: True
      interaction_mode: multi
      physics_dt: 0.005
      substeps: 10
      max_episode_length: 6000
      from_ground: False
      drone_model: hummingbird
      controller: lee_position
      action_mode: velocity_cmd
      goal_visible_to_sensors: False
      action_limit_vel: 1.5
      action_limit_yaw_rate: 3.14
      use_yaw_rate: False
      obs_mode: auto
      hold_after_reset: True
      reward_effort_weight: 0.05
      alive_bonus: 1.0
      goal_bonus: 5.0
      progress_sigmoid_k: 20.0
      progress_sigmoid_offset: 0.005
      avg_speed_window: 40
      avg_speed_threshold: 0.35
      avg_speed_sigmoid_k: 8.0
      avg_speed_warmup: 10
      base_link_collision_force_threshold: 1.0e-4
      collision_penalty: 10.0
      min_start_dist: 0.4
      lidar:
        enabled: True
        range: 12.0
        vfov: [0.0, 40.0]
        vres: 20
        hres: 180
      dcam:
        enabled: True
        resolution: [80, 48]
        max_range: 6.0
        focal_length: 2.09
        horizontal_aperture: 3.896
        clipping_range: [0.3, 6.0]
        translation: [0.0, 0.0, 0.05]
        pitch_deg: 10.0
      terrain:
        size: 30.0
        seed: 1
      perimeter:
        enabled: True
        thickness: 0.3
        height: 4.0
      obstacles:
        dynamic:
          enabled: False
          sample_horizon_s: 2.0
          sample_dt_s: 0.25
          collision_margin: 0.05
          speed_scale: 0.5
          items:
            dyn_0:
              shape: box
              size: [0.7, 0.7, 0.7]
              motion:
                type: line
                center: [0.0, 0.0, 1.2]
                direction: [1.0, 0.0, 0.0]
                amplitude: 5.0
                omega: 0.45
                phase: 0.0
            dyn_1:
              shape: box
              size: [0.7, 0.7, 0.7]
              motion:
                type: line
                center: [2.5, -1.5, 1.4]
                direction: [0.0, 1.0, 0.0]
                amplitude: 4.0
                omega: 0.55
                phase: 1.2
            dyn_2:
              shape: box
              size: [0.7, 0.7, 0.7]
              motion:
                type: circle
                center: [-3.0, 3.0, 1.3]
                radius: 2.2
                omega: 0.4
                phase: 0.6
            dyn_3:
              shape: box
              size: [0.7, 0.7, 0.7]
              motion:
                type: circle
                center: [4.0, -4.0, 1.1]
                radius: 1.8
                omega: 0.7
                phase: -0.3
      use_seed: True
      domain_rand:
        enabled: False
        drone:
          mass_scale: [0.9, 1.1]
          inertia_scale: [0.9, 1.1]
          t2w_scale: [0.7, 1.15]
          f2m_scale: [0.9, 1.1]
          drag_coef_scale: [0.0, 0.5]
          tau_up: [0.3, 0.6]
          tau_down: [0.3, 0.6]
        controller:
          pos_gain_scale: [0.7, 1.3]
          vel_gain_scale: [0.7, 1.3]
          att_gain_scale: [0.75, 1.25]
          ang_rate_gain_scale: [0.8, 1.2]
      visualize:
        enabled: False
        trail_stride: 4
        trail_width_range: [1.5, 5.0]
        highlight_enabled: False
        highlight_color: [0.0, 0.6, 1.0]
        highlight_intensity: 100.0
      video:
        enabled: True
        drone_following: False
        attach_to_drone: False
        follow_all_envs: False
        prim_path: /World/Camera
        focus_env: 0
        pos: [10.0, 10.0, 5.0]
        lookat: [0.0, 0.0, 2.0]
        resolution: [720, 480]
        fps: 30
        segment_every: 100000
        segment_length_seconds: 100
        outdir: video

    drone_nav:
      headless: True
      interaction_mode: nav
      physics_dt: 0.005
      substeps: 10
      max_episode_length: 3500
      from_ground: False
      drone_model: hummingbird
      controller: lee_position
      action_mode: velocity_cmd
      device: 'cuda:0'
      goal_visible_to_sensors: False
      action_limit_vel: 1.5
      action_body_vel_scale: [1.5, 1.5, 0.5]
      action_body_vel_clip: [1.5, 1.5, 0.5]
      action_limit_yaw_rate: 3.14
      use_yaw_rate: False
      obs_mode: goal_frame
      include_direction_obs: False
      hold_after_reset: False
      spawn_xy_range: 24.0
      spawn_height: 1.5
      start_goal_height_range: [1.0, 1.5]
      spawn_min_dist: 24.0
      goal_reach_dist: 1.0
      obs_clearance: 0.8
      max_flight_height: 2.0
      reward_height_scale: 2.0
      reward_smoothness_scale: 0.0
      base_link_collision_force_threshold: 1.0e-4
      use_seed: True
      domain_rand:
        enabled: True
        drone:
          mass_scale: [0.9, 1.1]
          inertia_scale: [0.85, 1.15]
          t2w_scale: [0.85, 1.15]
          f2m_scale: [0.85, 1.15]
          drag_coef_scale: [0.75, 1.25]
          tau_up: [0.37, 0.49]
          tau_down: [0.37, 0.49]
      lidar:
        enabled: False
        range: 4.0
        vfov: [-5.0, 25.0]
        vres: 16
        hres: 180
        hfov: 360.0
      dcam:
        enabled: True
        resolution: [80, 48]
        max_range: 6.0
        focal_length: 2.09
        horizontal_aperture: 3.896
        clipping_range: [0.6, 6.0]
        translation: [0.0, 0.0, 0.0]
        pitch_deg: 0.0
      terrain:
        size: 48.0
        seed: 0
        hide_obstacles: True
        num_obstacles: 0
        obstacle_width_range: [0.4, 0.8]
        obstacle_height_range: [3.0, 4.0]
        platform_width: 1.5
      perimeter:
        enabled: True
        thickness: 0.3
        height: 4.0
      obstacles:
        enable_physics_collision: False
        cuboids:
          count: 300
          width_range: [0.25, 1.0]
          height_range: [2.0, 3.0]
          color: [0.0, 1.0, 0.0]
        walls:
          count: 35
          length: 5.0
          height_range: [2.0, 3.0]
          thickness: 0.2
          color: [0.8, 0.4, 0.1]
          randomize_yaw: True
        traps:
          count: 12
          opening_width_range: [2.0, 4.0]
          arm_depth_range: [1.0, 2.0]
          height_range: [2.0, 3.0]
          thickness_range: [0.15, 0.3]
          randomize_yaw: True
          asymmetric_arms: False
          color: [0.1, 0.4, 0.8]
        dynamic:
          enabled: False
      visualize:
        enabled: True
        show_goal_marker: True
        trail_stride: 4
        trail_width_range: [1.5, 5.0]
        speed_range: [0.0, 2.5]
        max_points: 400
        highlight_enabled: False
        highlight_color: [0.0, 0.6, 1.0]
        highlight_intensity: 100.0
      video:
        enabled: True
        drone_following: False
        attach_to_drone: False
        follow_all_envs: False
        prim_path: /World/nav_video_camera
        focus_env: 0
        pos: [60.0, 60.0, 50.0]
        lookat: [0.0, 0.0, 2.0]
        resolution: [1440, 1080]
        fps: 20
        segment_every: 50000
        segment_length_seconds: 100
        outdir: video

  # Replay buffer
  replay:
    size: 2e5
    online: True
    fracs: {uniform: 1.0, priority: 0.0, recency: 0.0}
    prio: {exponent: 0.8, maxfrac: 0.5, initial: inf, zero_on_sample: True}
    priosignal: model
    recexp: 1.0
    chunksize: 1024

  # Run loop
  run:
    steps: 1e10
    duration: 0
    train_ratio: 32.0
    log_every: 120
    report_every: 300
    save_every_steps: 0
    save_every: 900
    video_every: 0
    envs: 16
    eval_envs: 4
    eval_eps: 1
    report_batches: 1
    from_checkpoint: ''
    from_checkpoint_regex: ''
    episode_timeout: 180
    actor_addr: 'localhost:{auto}'
    replay_addr: 'localhost:{auto}'
    logger_addr: 'localhost:{auto}'
    actor_batch: -1
    actor_threads: 1
    agent_process: False
    remote_replay: False
    remote_envs: False
    usage: {psutil: True, nvsmi: True, gputil: False, malloc: False, gc: False}
    debug: True

  # JAX runtime
  jax:
    platform: cpu
    compute_dtype: bfloat16
    policy_devices: [3]
    train_devices: [2]
    mock_devices: 0
    prealloc: True
    jit: True
    debug: False
    profiler: False
    expect_devices: 0
    enable_policy: True
    coordinator_address: ''

  # Dreamer agent
  agent:
    loss_scales: {rec: 1.0, rew: 1.0, con: 1.0, dyn: 1.0, rep: 0.1, policy: 1.0, value: 1.0, repval: 0.3}
    opt: {lr: 4e-5, agc: 0.3, eps: 1e-20, beta1: 0.9, beta2: 0.999, momentum: True, wd: 0.0, schedule: const, warmup: 1000, anneal: 0}
    ac_grads: False
    dyn:
      typ: rssm
      rssm: {deter: 8192, hidden: 1024, stoch: 32, classes: 64, act: silu, norm: rms, unimix: 0.01, outscale: 1.0, winit: trunc_normal_in, imglayers: 2, obslayers: 1, dynlayers: 1, absolute: False, blocks: 8, free_nats: 1.0}
    enc:
      typ: simple
      simple: {depth: 64, mults: [2, 3, 4, 4], layers: 3, units: 1024, act: silu, norm: rms, winit: trunc_normal_in, symlog: True, depth_symlog: False, outer: False, kernel: 5, strided: False}
    dec:
      typ: simple
      simple: {depth: 64, mults: [2, 3, 4, 4], layers: 3, units: 1024, act: silu, norm: rms, outscale: 1.0, winit: trunc_normal_in, outer: False, kernel: 5, bspace: 8, strided: False}
    rewhead: {layers: 1, units: 1024, act: silu, norm: rms, output: symexp_twohot, outscale: 0.0, winit: trunc_normal_in, bins: 255}
    conhead: {layers: 1, units: 1024, act: silu, norm: rms, output: binary, outscale: 1.0, winit: trunc_normal_in}
    policy: {layers: 3, units: 1024, act: silu, norm: rms, minstd: 0.1, maxstd: 1.0, outscale: 0.01, unimix: 0.01, winit: trunc_normal_in}
    value: {layers: 3, units: 1024, act: silu, norm: rms, output: symexp_twohot, outscale: 0.0, winit: trunc_normal_in, bins: 255}
    policy_dist_disc: categorical
    policy_dist_cont: bounded_normal
    imag_last: 0
    imag_length: 15
    horizon: 333
    contdisc: True
    imag_loss: {slowtar: False, lam: 0.95, actent: 3e-4, actsmooth: 5e-2, slowreg: 1.0}
    repl_loss: {slowtar: False, lam: 0.95, slowreg: 1.0}
    slowvalue: {rate: 0.02, every: 1}
    retnorm: {impl: perc, rate: 0.01, limit: 1.0, perclo: 5.0, perchi: 95.0, debias: False}
    valnorm: {impl: none, rate: 0.01, limit: 1e-8}
    advnorm: {impl: none, rate: 0.01, limit: 1e-8}
    reward_grad: True
    repval_loss: True
    repval_grad: True
    report: True
    report_gradnorms: False

# Model size presets
sizetest: &sizetest
  .*\.rssm: {deter: 32, hidden: 4, classes: 2}
  .*\.depth: 4
  .*\.units: 4

size1m: &size1m
  .*\.rssm: {deter: 512, hidden: 64, classes: 4}
  .*\.depth: 4
  .*\.units: 64

size12m: &size12m
  .*\.rssm: {deter: 2048, hidden: 256, classes: 16}
  .*\.depth: 16
  .*\.units: 256

size25m: &size25m
  .*\.rssm: {deter: 3072, hidden: 384, classes: 24}
  .*\.depth: 24
  .*\.units: 384

size50m: &size50m
  .*\.rssm: {deter: 4096, hidden: 512, classes: 32}
  .*\.depth: 32
  .*\.units: 512

size100m: &size100m
  .*\.rssm: {deter: 6144, hidden: 768, classes: 48}
  .*\.depth: 48
  .*\.units: 768

size200m: &size200m
  .*\.rssm: {deter: 8192, hidden: 1024, classes: 64}
  .*\.depth: 64
  .*\.units: 1024

size400m: &size400m
  .*\.rssm: {deter: 12288, hidden: 1536, classes: 96}
  .*\.depth: 96
  .*\.units: 1536

# Drone task presets
drone_multi:
  <<: *size200m
  task: drone_multi
  run: {envs: 4, eval_envs: 1, train_ratio: 64, steps: 1e8}
  jax: {platform: cuda}
  agent:
    loss_scales: {rec: 2.0, rew: 1.0, con: 1.0, dyn: 1.0, rep: 0.05, policy: 1.0, value: 1.0, repval: 0.3}
  env.drone_multi:
    collision_penalty: 10.0
    alive_bonus: 1.0
    goal_bonus: 5.0

drone_nav: &drone_nav
  <<: *size100m
  task: dronenav_nav
  report_length: 32
  batch_length: 128
  replay_context: 16
  run: {envs: 16, eval_envs: 16, train_ratio: 64, steps: 2.5e6}
  jax: {platform: cuda, policy_devices: [1], train_devices: [0]}

train:
  <<: *drone_nav

# Infrastructure presets
multicpu:
  batch_size: 12
  jax.mock_devices: 8
  jax.policy_devices: [0, 1]
  jax.train_devices: [2, 3, 4, 5, 6, 7]

debug:
  batch_size: 8
  batch_length: 10
  report_length: 5
  jax: {platform: cpu, debug: True, prealloc: False}
  run: {envs: 4, report_every: 10, log_every: 5, save_every: 15, train_ratio: 8, debug: True}
  replay.size: 1e4
  agent:
    .*\.bins: 5
    .*\.layers: 1
    .*\.units: 8
    .*\.stoch: 2
    .*\.classes: 4
    .*\.deter: 8
    .*\.hidden: 3
    .*\.blocks: 4
    .*\.depth: 2
